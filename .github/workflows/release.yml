name: release

on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: "Tag to build(留空则从main最新提交构建)"
        required: false
        default: ""
      enable_latest_tag:
        description: "Enable latest tag for docker image"
        required: false
        type: boolean
        default: false
  #push:
  #  tags:
  #    - "v0.*"
  #    - "v1.*"

jobs:
  Build:
    name: build-binary
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Hello world
        run: uname -a

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.build_tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: "16"
          cache: "yarn"
          cache-dependency-path: "web/yarn.lock"
      - name: Build web
        working-directory: web
        run: |
          yarn install
          yarn run build
      #      - uses: actions/setup-go@v4
      #        with:
      #          go-version: '1.24'
      #          cache-dependency-path: 'server/go.sum'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: wsczx
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Pre bash
        shell: bash
        run: |
          appVer=`cat version`
          commitId=`git rev-parse HEAD`
          echo "APP_VER=$appVer" >> $GITHUB_ENV
          echo "commitId=$commitId" >> $GITHUB_ENV

          echo $appVer > version_info
          echo $commitId >> version_info
          echo $GITHUB_REF >> version_info
          echo $GITHUB_REF_NAME >> version_info

          #cd server;go mod tidy

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=gha,scope=remlink
          cache-to: type=gha,mode=max,scope=remlink
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          #platforms: linux/amd64
          build-args: |
            appVer=${{ env.APP_VER }}
            commitId=${{ env.commitId }}
          tags: |
            wsczx/remlink:${{ env.APP_VER }}
            ${{ github.event.inputs.enable_latest_tag == 'true' && 'wsczx/remlink:latest' || '' }}

      - name: Build deploy binary
        shell: bash
        run: bash scripts/release.sh

      - name: Extract changelog for current version
        id: changelog
        shell: bash
        run: |
          ver="${{ env.APP_VER }}"
          section=$(awk -v ver="$ver" '
            /^## / { found=0 }
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$section" ]; then
            section="RemLink v${ver} 发布"
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$section" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Release to public repo (wsczx/RemLink)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          owner: wsczx
          repo: RemLink
          tag: v${{ env.APP_VER }}
          name: RemLink v${{ env.APP_VER }}
          artifacts: artifact-dist/*
          allowUpdates: true
          body: ${{ steps.changelog.outputs.body }}

      - name: Pack source code
        shell: bash
        run: |
          mkdir -p artifact-src
          tar --exclude='.git' \
              --exclude='web/node_modules' \
              --exclude='server/ui' \
              --exclude='server/conf' \
              --exclude='artifact-dist' \
              --exclude='artifact-src' \
              -czf artifact-src/RemLink-src-v${{ env.APP_VER }}.tar.gz .

      - name: Release source to private repo (wsczx/RemLink-private)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.APP_VER }}
          name: RemLink-src v${{ env.APP_VER }}
          artifacts: artifact-src/*
          allowUpdates: true
          body: ${{ steps.changelog.outputs.body }}

